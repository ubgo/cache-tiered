name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: true
      # Depends on sibling modules until they are tagged.
      - name: checkout ubgo/cache sibling
        uses: actions/checkout@v6
        with:
          repository: ubgo/cache
          path: ../cache
      - name: checkout ubgo/cache-mem sibling
        uses: actions/checkout@v6
        with:
          repository: ubgo/cache-mem
          path: ../cache-mem
      - name: vet
        run: go vet ./...
      - name: test (race + coverage)
        run: go test -race -count=2 -coverprofile=cover.out ./...
